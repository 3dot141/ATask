# The Xcode project is generated from this file: run scripts/generate.sh (XcodeGen), then open
# ATask.xcodeproj. The generated project is not checked in.
name: ATask
options:
  bundleIdPrefix: com.yes365
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
  # Debug's identity with optimized code (Configuration/Profile.xcconfig).
  Profile: release
configFiles:
  Debug: Configuration/Debug.xcconfig
  Release: Configuration/Release.xcconfig
  Profile: Configuration/Profile.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
targets:
  ATask:
    type: application
    platform: iOS
    sources:
      - path: ATask
      - path: Shared
      # The bundled Silero voice detector for local speech (IosSpeechStorage reads it from here).
      - path: ../native/speech/models/ggml-silero-v6.2.0.bin
        buildPhase: resources
    dependencies:
      - target: ATaskWidgets
      - target: ATaskShare
    info:
      path: ATask/Info.plist
      properties:
        # The app follows the device language: Chinese when the phone is Chinese, English otherwise.
        CFBundleLocalizations:
          - en
          - zh-Hans
        NSCalendarsFullAccessUsageDescription: ATask shows the events of your calendar next to your tasks. It stays on this phone.
        NSCalendarsUsageDescription: ATask shows the events of your calendar next to your tasks. It stays on this phone.
        CFBundleDisplayName: $(ATASK_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        # Compose Multiplatform draws at the display's full refresh rate only with this key.
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Self-hosted Vikunja servers often run on plain http on a home network. Only
        # NSAllowsArbitraryLoads is set: with NSAllowsLocalNetworking or
        # NSAllowsArbitraryLoadsInWebContent present as well, iOS ignores it.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: ATask connects to your Vikunja server, which may be on your local network.
        # Location reminders. No location background mode: CLMonitor relaunches the app for an event.
        NSLocationWhenInUseUsageDescription: ATask uses your location to remind you when you arrive at or leave a place you chose. It stays on this device.
        NSLocationAlwaysAndWhenInUseUsageDescription: ATask uses your location to remind you when you arrive at or leave a place you chose, also when the app is closed. It stays on this device.
        # Holding + to say a task: asked on the first hold, never at start (docs/voice-input.md).
        NSMicrophoneUsageDescription: ATask listens while you hold the + button or turn its microphone on, to add what you say as tasks and to answer your questions in Ask.
        NSSpeechRecognitionUsageDescription: ATask turns what you say into text for your tasks and for Ask. Apple processes the speech, on the device where it can; with a speech model downloaded in Settings, Assistant, it stays on the device.
        CFBundleURLTypes:
          - CFBundleURLName: com.yes365.atask
            CFBundleURLSchemes:
              - $(ATASK_URL_SCHEME)
        # Read by the shared Kotlin code and the extensions.
        ATaskUrlScheme: $(ATASK_URL_SCHEME)
        ATaskAppGroup: $(ATASK_APP_GROUP)
        # The home-screen quick actions (SceneDelegate in AppDelegate.swift).
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.yes365.atask.add
            UIApplicationShortcutItemTitle: Add task
            UIApplicationShortcutItemIconType: UIApplicationShortcutIconTypeAdd
          - UIApplicationShortcutItemType: com.yes365.atask.dictate
            UIApplicationShortcutItemTitle: Dictate
            UIApplicationShortcutItemIconSymbolName: mic
        BGTaskSchedulerPermittedIdentifiers:
          - com.yes365.atask.refresh
          - com.yes365.atask.sync
        UIBackgroundModes:
          - fetch
          - processing
    entitlements:
      path: ATask/ATask.entitlements
      properties:
        com.apple.security.application-groups:
          - $(ATASK_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATASK_BUNDLE_ID)
        PRODUCT_NAME: ATask
        # Shared/ is built into the app and the extensions; this tells them apart.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) ATASK_APP
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/../shared/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)
        # The shared framework is static, so the app links what its speech library needs
        # (shared/src/nativeInterop/cinterop/vicuSpeech.def).
        OTHER_LDFLAGS: $(inherited) -framework shared -framework Metal -framework MetalKit -framework Accelerate -lc++
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks
    preBuildScripts:
      - name: Build the shared Kotlin framework
        basedOnDependencyAnalysis: false
        script: |
          "$SRCROOT/scripts/build-shared-framework.sh"

  # The widgets and the Control Center control. Swift only: no Kotlin is linked. The app writes
  # what they show into the App Group (shared/.../widget/WidgetSnapshots.kt).
  ATaskWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: ATaskWidgets
      - path: Shared
    info:
      path: ATaskWidgets/Info.plist
      properties:
        # The app follows the device language: Chinese when the phone is Chinese, English otherwise.
        CFBundleLocalizations:
          - en
          - zh-Hans
        NSCalendarsFullAccessUsageDescription: ATask shows the events of your calendar next to your tasks. It stays on this phone.
        NSCalendarsUsageDescription: ATask shows the events of your calendar next to your tasks. It stays on this phone.
        CFBundleDisplayName: $(ATASK_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        ATaskUrlScheme: $(ATASK_URL_SCHEME)
        ATaskAppGroup: $(ATASK_APP_GROUP)
    entitlements:
      path: ATaskWidgets/ATaskWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(ATASK_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATASK_BUNDLE_ID).widgets
        PRODUCT_NAME: ATaskWidgets
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks

  # The share sheet: saves what is shared into the App Group (share-inbox/), and the app turns it
  # into a task (shared/.../share/IosShareInbox.kt). Swift only.
  ATaskShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ATaskShare
    info:
      path: ATaskShare/Info.plist
      properties:
        # The app follows the device language: Chinese when the phone is Chinese, English otherwise.
        CFBundleLocalizations:
          - en
          - zh-Hans
        NSCalendarsFullAccessUsageDescription: ATask shows the events of your calendar next to your tasks. It stays on this phone.
        NSCalendarsUsageDescription: ATask shows the events of your calendar next to your tasks. It stays on this phone.
        CFBundleDisplayName: $(ATASK_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # What ATask is offered for: text, a web page, images, videos and files.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsMovieWithMaxCount: 5
              NSExtensionActivationSupportsFileWithMaxCount: 10
        ATaskAppGroup: $(ATASK_APP_GROUP)
    entitlements:
      path: ATaskShare/ATaskShare.entitlements
      properties:
        com.apple.security.application-groups:
          - $(ATASK_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(ATASK_BUNDLE_ID).share
        PRODUCT_NAME: ATaskShare
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: $(inherited) @executable_path/Frameworks @executable_path/../../Frameworks
